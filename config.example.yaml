queue_size: 3
visualize: false
pipeline:
  camera:
    backend: directshow
    max_consecutive_empty_frames: 30
speech:
  motion_threshold: 0.025
  velocity_threshold: 1.00
  acceleration_threshold: 10.0
  filter:
    strategy: exponential_moving_average
    window_size: 7
    ema_alpha: 0.25
  state_machine:
    start_confidence: 0.70
    end_confidence: 0.15
    start_hold_seconds: 0.40
    end_hold_seconds: 2.00
    minimum_talking_seconds: 1.00
